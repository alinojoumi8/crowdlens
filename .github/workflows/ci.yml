name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
      skip_image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.9.26
      - name: Install backend dependencies
        run: uv sync --frozen --dev
      - name: Run backend tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and audit launcher dependencies
        run: npm ci && npm audit --audit-level=moderate
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          NEO4J_PASSWORD=ci-only-password docker compose config --quiet

  docker:
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Reserve image-build space on the disposable runner
        run: bash scripts/prepare_ci_disk.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: crowdlens:ci
          build-args: CROWDLENS_BUILD_REVISION=${{ inputs.revision || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image offline
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: python scripts/smoke_container.py --image crowdlens:ci --revision "$REVISION" --output container-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-smoke
          path: container-smoke.json
